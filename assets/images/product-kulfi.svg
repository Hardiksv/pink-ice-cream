<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#FFE4EE"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="350" rx="90" ry="20" fill="#3B1F2B" opacity="0.18"/>
  <g transform="translate(140, 70)">
    <!-- Wooden Stick -->
    <rect x="52" y="210" width="16" height="90" rx="6" fill="#FFE08A" stroke="#3B1F2B" stroke-width="3"/>
    <!-- Kulfi Tapered Body -->
    <path d="M25,220 L35,50 C35,25 85,25 85,50 L95,220 Z" fill="#FFE08A" stroke="#3B1F2B" stroke-width="4"/>
    <!-- Pistachio & Saffron flecks -->
    <circle cx="50" cy="80" r="4" fill="#BFE3C0"/>
    <circle cx="70" cy="110" r="5" fill="#BFE3C0"/>
    <circle cx="55" cy="150" r="4.5" fill="#BFE3C0"/>
    <circle cx="68" cy="180" r="4" fill="#D81B60"/>
    <circle cx="45" cy="120" r="3" fill="#D81B60"/>
    <circle cx="62" cy="70" r="3.5" fill="#FF6FA5"/>
    <!-- Cardamom speckles -->
    <circle cx="75" cy="140" r="2" fill="#3B1F2B"/>
    <circle cx="42" cy="170" r="2" fill="#3B1F2B"/>
    <!-- Label Band -->
    <rect x="23" y="160" width="74" height="24" fill="#FF6FA5" stroke="#3B1F2B" stroke-width="2"/>
    <text x="60" y="177" font-family="'Bricolage Grotesque', sans-serif" font-weight="800" font-size="10" fill="#3B1F2B" text-anchor="middle">MATKA KULFI</text>
  </g>
</svg>